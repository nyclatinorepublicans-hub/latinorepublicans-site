<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&display=swap">
<style>
@import url("https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;700&display=swap");
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#f8f1e4;color:#1b2133;font-family:"Hepta Slab",Georgia,"Times New Roman",serif}
.who{padding:clamp(56px,8vw,100px) clamp(16px,5vw,72px);text-align:center}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:85%;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#c8693f;display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:2px;background:#d9a441}
h2{font-family:"Archivo","Arial Narrow",Impact,sans-serif;font-stretch:72%;font-weight:900;text-transform:uppercase;line-height:.95;margin:0 0 6px;font-size:clamp(46px,6.4vw,92px);letter-spacing:.01em;color:#14254a;text-wrap:balance;text-shadow:2.60px 0.00px 0 #f0c35f,2.40px 0.99px 0 #f0c35f,1.84px 1.84px 0 #f0c35f,0.99px 2.40px 0 #f0c35f,0.00px 2.60px 0 #f0c35f,-0.99px 2.40px 0 #f0c35f,-1.84px 1.84px 0 #f0c35f,-2.40px 0.99px 0 #f0c35f,-2.60px 0.00px 0 #f0c35f,-2.40px -0.99px 0 #f0c35f,-1.84px -1.84px 0 #f0c35f,-0.99px -2.40px 0 #f0c35f,-0.00px -2.60px 0 #f0c35f,0.99px -2.40px 0 #f0c35f,1.84px -1.84px 0 #f0c35f,2.40px -0.99px 0 #f0c35f,0 1px 0 #e9bd5a,0 2px 0 #d9a441,0 3px 0 #cc9636,0 4px 0 #be892d,0 5px 0 #ad7a25,0 6px 0 #9a6b1f,0 9px 8px rgba(20,37,74,.35),0 18px 24px rgba(20,37,74,.25)}
h2 span{color:inherit}
.sub{font-style:italic;font-size:clamp(16px,1.4vw,19px);color:#5d6478;margin:16px auto 0}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;margin-top:48px}
.member{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;border-radius:18px;padding:10px 6px 16px;transition:background .25s}
.member:hover{background:#efe3cc}
.member:focus-visible{outline:3px solid #d9a441;outline-offset:3px}
.frame{position:relative;width:100%;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;border:5px solid #14254a;box-shadow:0 0 0 4px #d9a441,0 18px 30px -16px rgba(20,37,74,.7);background:linear-gradient(160deg,#1f3870,#14254a);display:grid;place-items:center;margin-bottom:12px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ini{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:72%;font-weight:900;font-size:clamp(36px,4vw,54px);color:#d9a441;letter-spacing:.02em}
.name{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:80%;font-weight:800;text-transform:uppercase;font-size:clamp(17px,1.6vw,21px);line-height:1.05;color:#14254a;overflow-wrap:anywhere}
.role{font-size:13.5px;line-height:1.3;color:#c8693f}
.more{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#14254a;opacity:.55;margin-top:4px;transition:opacity .2s}
.member:hover .more{opacity:1}

/* side panel */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;z-index:10}
.panel{position:fixed;top:0;right:0;bottom:0;width:max(50%,min(560px,100%));max-width:100%;background:#fffaf1;z-index:11;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(10,18,40,.5);visibility:hidden}
.open .scrim{opacity:1;visibility:visible}
.open .panel{transform:none;visibility:visible}
.phead{position:relative;background:#14254a;color:#fff;padding:28px 28px 26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;flex:none}
.phead::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,#d9a441 0 18px,#c8323a 18px 36px)}
.pphoto{width:clamp(110px,14vw,160px);aspect-ratio:3/4;border-radius:999px 999px 12px 12px;overflow:hidden;border:4px solid #d9a441;background:linear-gradient(160deg,#1f3870,#0e1a36);display:grid;place-items:center;position:relative}
.pphoto .ini{font-size:48px}
.pname{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:72%;font-weight:900;text-transform:uppercase;font-size:clamp(34px,3.6vw,52px);line-height:.92;margin:0}
.prole{color:#d9a441;font-size:16px;margin:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(217,164,65,.5);color:#fff}
.close{all:unset;position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(255,255,255,.12);font-size:22px;line-height:1}
.close:hover,.close:focus-visible{background:#c8323a}
.pbody{flex:1;overflow-y:auto;padding:36px 28px 32px;display:flex;flex-direction:column;gap:26px}
.lbl{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#c8693f;margin:0 0 10px}
.bio{font-size:17px;line-height:1.65;color:#2c3550;margin:0;white-space:pre-line}
blockquote{margin:0;padding:18px 22px;border-left:5px solid #c8323a;background:#f3e9d6;border-radius:0 12px 12px 0;font-size:19px;line-height:1.45;font-style:italic;color:#14254a}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.links a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid #e6d8bd;background:#fff;text-decoration:none;color:#14254a;min-width:0;transition:border-color .2s,transform .2s}
.links a:hover,.links a:focus-visible{border-color:#d9a441;transform:translateY(-2px)}
.links .ico{flex:none;width:36px;height:36px;border-radius:50%;background:#14254a;display:grid;place-items:center}
.links .ico svg{width:18px;height:18px}
.links b{display:block;font-family:"Archivo","Arial Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.links small{display:block;font-size:13px;color:#5d6478;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:14px;color:#5d6478;font-style:italic;margin:0}
.navrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #e6d8bd;padding:14px 28px;flex:none;background:#fffaf1}
.navrow button{all:unset;cursor:pointer;font-family:"Archivo","Arial Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#14254a;padding:10px 14px;border-radius:999px;border:1.5px solid #14254a}
.navrow button:hover,.navrow button:focus-visible{background:#14254a;color:#fff}


/*3d*/
/* 3D tilt + layered parallax */
.member{perspective:900px}
.frame{transform-style:preserve-3d;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;
  box-shadow:0 0 0 4px #d9a441,0 3px 0 4px #c99532,0 6px 0 4px #b07e27,0 9px 0 4px #8f631c,0 26px 34px -14px rgba(20,37,74,.75)}
.frame .bd{position:absolute;left:-5.5%;top:-5.5%;width:111%;height:111%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.frame .pp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.frame .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .4s;mix-blend-mode:soft-light}
.member:hover .frame{transform:none}
.member.tilting .frame,.member.tilting .bd,.member.tilting .pp{transition:transform .08s linear}
.member.tilting .glare,.member:hover .glare{opacity:1}
.pphoto .bd{position:absolute;left:-5.5%;top:-5.5%;width:111%;height:111%;object-fit:cover}
.pphoto .pp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.pphoto{box-shadow:0 3px 0 0 #c99532,0 6px 0 0 #8f631c,0 18px 26px -10px rgba(0,0,0,.6)}

/* service badges (profile panel only) */
.pphoto-wrap{position:relative;flex:none}
.honor-coin{position:absolute;right:-16px;bottom:-14px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#fff6d2 0%,#f4cf72 22%,#d9a441 48%,#a8711f 78%,#7a4d12 100%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.75),inset 0 -4px 7px rgba(70,40,5,.55),0 8px 16px -4px rgba(0,0,0,.6),0 0 0 3px #14254a}
.honor-coin::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#f6d27c 0%,#d9a441 55%,#b17a25 100%);box-shadow:inset 0 -1px 2px rgba(255,240,200,.6),inset 0 2px 4px rgba(80,45,5,.55)}
.honor-coin svg{position:relative;width:36px;height:36px;filter:drop-shadow(0 1px 0 rgba(255,244,210,.8)) drop-shadow(0 2px 2px rgba(60,30,0,.35))}
.honor{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#14254a,#1f3870);color:#fff;border:1px solid rgba(217,164,65,.6)}
.honor .hstripe{flex:none;width:34px;height:22px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.honor b{display:block;font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#d9a441}
.honor span{display:block;font-style:italic;font-size:15px;line-height:1.3}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.phead{grid-template-columns:1fr;justify-items:start}.links{grid-template-columns:1fr}.pbody{padding:28px 20px}}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.frame{transition:none}}

    <p class="eyebrow">Who we are</p>
    <h2>Executive <span>Board</span></h2>
    <p class="sub">Select a founding member to view their profile.</p>

</section>

<div class="scrim" id="scrim"></div>

    <div><p class="lbl">Connect</p><div class="links" id="plinks"></div></div>
  </div>

</aside>

function handle(k,v){
  if(k==='email') return v;
  try{const u=new URL(v);let p=u.pathname.replace(/\/+$/,'');if(k==='website')return u.hostname.replace(/^www\./,'');return p&&p!=='/'?(p.startsWith('/@')?p.slice(1):'@'+p.split('/').pop()):u.hostname;}catch(e){return v;}
}

  bar.hidden=false;
}

/* 3D tilt follows the pointer */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function move(card,e){
    const f=card.querySelector('.frame'), r=f.getBoundingClientRect();
    const x=Math.max(-.5,Math.min(.5,(e.clientX-r.left)/r.width-.5)), y=Math.max(-.5,Math.min(.5,(e.clientY-r.top)/r.height-.5));
    card.classList.add('tilting');
    f.style.transform='translateY(-8px) rotateY('+(x*18).toFixed(2)+'deg) rotateX('+(-y*14).toFixed(2)+'deg)';
    f.style.setProperty('--gx',((x+.5)*100).toFixed(0)+'%');f.style.setProperty('--gy',((y+.5)*100).toFixed(0)+'%');
    const bd=f.querySelector('.bd'), pp=f.querySelector('.pp');
    if(bd) bd.style.transform='translate('+(-x*14).toFixed(1)+'px,'+(-y*10).toFixed(1)+'px)';
    if(pp) pp.style.transform='translate('+(x*10).toFixed(1)+'px,'+(y*6).toFixed(1)+'px) scale(1.04)';
  }
  function reset(card){
    const f=card.querySelector('.frame');card.classList.remove('tilting');
    f.style.transform='';const bd=f.querySelector('.bd'),pp=f.querySelector('.pp');if(bd)bd.style.transform='';if(pp)pp.style.transform='';
  }
  document.querySelectorAll('.member').forEach(card=>{
    card.addEventListener('pointermove',e=>move(card,e));
    card.addEventListener('pointerleave',()=>reset(card));
    card.addEventListener('pointercancel',()=>reset(card));
    card.addEventListener('pointerup',()=>setTimeout(()=>reset(card),150));
  });
})();
let cur=0, lastFocus=null;
function fill(i){
  const m=BOARD[i]; cur=i;
  document.getElementById('pphoto').innerHTML=pic(m);
  document.getElementById('pname').textContent=m.name;
  document.getElementById('prole').textContent=m.role;
  document.getElementById('ptags').innerHTML=(m.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
  document.getElementById('pbio').textContent=m.bio||'';
  const q=document.getElementById('pquote'); q.textContent=m.quote?'“'+m.quote.replace(/^["“]|["”]$/g,'')+'”':''; q.hidden=!m.quote;
  const links=Object.keys(ICONS).filter(k=>m[k]).map(k=>{
    const href=k==='email'?'mailto:'+m[k]:m[k];
    return '<a href="'+esc(href)+'" target="_blank" rel="noopener"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k][1]+'</svg></span><span style="min-width:0"><b>'+ICONS[k][0]+'</b><small>'+esc(handle(k,m[k]))+'</small></span></a>';
  }).join('');
  document.getElementById('plinks').innerHTML=links||'<p class="empty">Social links coming soon.</p>';
  honor(m);
  panel.querySelector('.pbody').scrollTop=0;
}
function placePanel(){const V=window.__LRCV;if(V){panel.style.top=V.top+'px';panel.style.bottom='auto';panel.style.height=Math.min(V.h,860)+'px';return;}
  const H=window.innerHeight, ph=Math.min(H,860);
  let top=0;
  const ref=lastCard||lastFocus;if(H>ph&&ref&&ref.getBoundingClientRect){top=Math.max(0,Math.min(ref.getBoundingClientRect().top-40,H-ph));}
  panel.style.top=top+'px';panel.style.bottom='auto';panel.style.height=ph+'px';
  try{parent.postMessage({lrc:'reveal',id:'board',y:top},'*');}catch(e){}
}
function openP(i){lastFocus=document.activeElement;fill(i);placePanel();root.classList.add('open');panel.setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('close').focus(),50);}
function closeP(){root.classList.remove('open');panel.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus();}
let lastCard=null;
grid.addEventListener('click',e=>{const b=e.target.closest('.member');if(b){lastCard=b;openP(+b.dataset.i);}});
document.getElementById('close').onclick=closeP;
document.getElementById('scrim').onclick=closeP;
document.getElementById('next').onclick=()=>fill((cur+1)%BOARD.length);
document.getElementById('prev').onclick=()=>fill((cur-1+BOARD.length)%BOARD.length);
document.addEventListener('keydown',e=>{
  if(!root.classList.contains('open'))return;
  if(e.key==='Escape')closeP();
  if(e.key==='ArrowRight')fill((cur+1)%BOARD.length);
  if(e.key==='ArrowLeft')fill((cur-1+BOARD.length)%BOARD.length);
  if(e.key==='Tab'){const f=[...panel.querySelectorAll('button,a[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
});
</script>
<script>
/* site helper: links to other parts of the site open in the main window; pop-ups open where the visitor is looking */
(function(){
  if(window.parent===window) return;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a||e.defaultPrevented) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;
    var u; try{u=new URL(a.getAttribute('href'),location.href);}catch(err){return;}
    if(u.origin!==location.origin) return;            /* Stripe, socials, email: leave alone */
    e.preventDefault(); e.stopPropagation(); parent.postMessage({lrc:'go',href:u.href},'*');
  },true);
  addEventListener('message',function(e){var d=e.data;if(!d||d.lrc!=='view')return;window.__LRCV=d;
    var p=document.getElementById('panel');if(p&&p.getAttribute('aria-hidden')==='false'&&window.placePanel)placePanel();});
})();
