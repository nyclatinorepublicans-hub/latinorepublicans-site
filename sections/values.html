<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&display=swap">
<style>
@import url("https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;700&display=swap");
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#14254a;color:#fff;font-family:"Hepta Slab",Georgia,"Times New Roman",serif}
.values{position:relative;overflow:hidden;padding:clamp(56px,8vw,100px) clamp(16px,5vw,72px);background:radial-gradient(ellipse at 50% 0%,#1f3870 0%,#14254a 60%)}
.values::before{content:"";position:absolute;inset:0;opacity:.06;background-image:radial-gradient(circle at 25% 25%,#d9a441 2px,transparent 2.5px),radial-gradient(circle at 75% 75%,#d9a441 2px,transparent 2.5px);background-size:44px 44px}
.wrap{position:relative;max-width:1100px;margin:0 auto;text-align:center}
.eyebrow{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:85%;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#d9a441;display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:2px;background:#c8323a}
h2{font-family:"Archivo","Arial Narrow",Impact,sans-serif;font-stretch:72%;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:.015em;margin:0;font-size:clamp(40px,6vw,80px);color:#fff;text-shadow:2.00px 0.00px 0 #d6a844,1.85px 0.77px 0 #d6a844,1.41px 1.41px 0 #d6a844,0.77px 1.85px 0 #d6a844,0.00px 2.00px 0 #d6a844,-0.77px 1.85px 0 #d6a844,-1.41px 1.41px 0 #d6a844,-1.85px 0.77px 0 #d6a844,-2.00px 0.00px 0 #d6a844,-1.85px -0.77px 0 #d6a844,-1.41px -1.41px 0 #d6a844,-0.77px -1.85px 0 #d6a844,-0.00px -2.00px 0 #d6a844,0.77px -1.85px 0 #d6a844,1.41px -1.41px 0 #d6a844,1.85px -0.77px 0 #d6a844,0 3px 0 #c99a3a,0 4px 0 #b68323,0 5px 0 #946a1c,0 6px 0 #7a5310,0 10px 10px rgba(0,0,0,.4),0 18px 24px rgba(0,0,0,.28)}
h2 span{color:inherit}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:52px}
.card{perspective:700px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(217,164,65,.25);border-radius:20px;padding:34px 18px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:border-color .3s,background .3s}
.card:hover{border-color:rgba(217,164,65,.7);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}

/* gold medallion */
.coin{position:relative;width:96px;height:96px;border-radius:50%;margin-bottom:18px;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#fff6d2 0%,#f4cf72 22%,#d9a441 48%,#a8711f 78%,#7a4d12 100%);
  box-shadow:inset 0 3px 4px rgba(255,255,255,.75),inset 0 -6px 10px rgba(70,40,5,.55),0 14px 22px -6px rgba(0,0,0,.6),0 0 0 4px rgba(217,164,65,.16);
  transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:float 5s ease-in-out infinite}
.coin::before{content:"";position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#f6d27c 0%,#d9a441 55%,#b17a25 100%);
  box-shadow:inset 0 -2px 3px rgba(255,240,200,.6),inset 0 3px 5px rgba(80,45,5,.55)}
.coin::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);background-size:250% 100%;background-position:120% 0;transition:background-position .9s ease;pointer-events:none}
.coin svg{position:relative;width:50px;height:50px;filter:drop-shadow(0 1.5px 0 rgba(255,244,210,.8)) drop-shadow(0 -1px 0 rgba(90,55,10,.45)) drop-shadow(0 3px 3px rgba(60,30,0,.35))}
.card:hover .coin{transform:rotateY(-22deg) rotateX(10deg) translateY(-4px)}
.card:hover .coin::after{background-position:-40% 0}
.card:nth-child(2) .coin{animation-delay:-.8s}.card:nth-child(3) .coin{animation-delay:-1.6s}
.card:nth-child(4) .coin{animation-delay:-2.4s}.card:nth-child(5) .coin{animation-delay:-3.2s}.card:nth-child(6) .coin{animation-delay:-4s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}

h3{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:78%;font-weight:800;text-transform:uppercase;font-size:clamp(22px,2.3vw,30px);line-height:1;letter-spacing:.03em;margin:0;color:#fff;white-space:nowrap}
@media (max-width:520px){h3{font-size:clamp(16px,4.6vw,22px);letter-spacing:.01em}}
.card p{margin:4px 0 0;font-style:italic;font-size:clamp(15px,1.35vw,18px);line-height:1.35;color:#e9c77e}

@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{gap:12px}.card{padding:24px 10px 22px}.coin{width:76px;height:76px;margin-bottom:12px}.coin::before{inset:6px}.coin svg{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.coin{animation:none;transition:none}.card:hover .coin{transform:none}}
</style><style id="wix-mobile-fit">/* Wix fit: no sideways scroll; if the Wix box is taller than the content, the section centers and the extra space matches its background */html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{max-width:100%;overflow-x:hidden}body>*{flex:0 0 auto;width:100%;box-sizing:border-box}</style>
</head>
<body>
<section class="values">
  <div class="wrap">
    <p class="eyebrow">What we stand for</p>
    <h2>Our <span>Values</span></h2>
    <div class="grid">

      <article class="card">
        <div class="coin"><svg viewBox="0 0 32 32" aria-hidden="true">

          <path d="M3.5 27.5v-5.5c0-4 2.6-6.6 6-6.6s6 2.6 6 6.6v5.5z"/><path d="M16.5 27.5v-5.5c0-4 2.6-6.6 6-6.6s6 2.6 6 6.6v5.5z"/>
          <circle cx="16" cy="17.2" r="2.8" stroke="#d9a441" stroke-width="1.2"/><path d="M11.5 28.5v-2.4c0-2.8 2-4.6 4.5-4.6s4.5 1.8 4.5 4.6v2.4z" stroke="#d9a441" stroke-width="1.2"/>
        </svg></div>
        <h3>Family</h3>

      </article>

      <article class="card">
        <div class="coin"><svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="12.5" fill="#14254a"/>
          <g stroke="#f4cf72" stroke-width="1.4" fill="none"><path d="M3.5 16h25M16 3.5c4.2 4 4.2 21 0 25M16 3.5c-4.2 4-4.2 21 0 25M5.5 9.5h21M5.5 22.5h21"/></g>
        </svg></div>
        <h3>Heritage</h3>
        <p>Roots worth passing on.</p>
      </article>

      <article class="card">
        <div class="coin"><svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="5.6" y="2.5" width="2.4" height="27" rx="1.2" fill="#14254a"/>
          <path d="M8 4.2c3.6-2 7.2 1.6 10.8 0s6-1.4 8.7 0v11.6c-2.7-1.4-5.1-1.6-8.7 0s-7.2-2-10.8 0z" fill="#14254a"/>
          <g fill="#f4cf72"><circle cx="10.8" cy="7" r=".9"/><circle cx="13.8" cy="7.4" r=".9"/><circle cx="12.3" cy="9.6" r=".9"/></g>
          <g stroke="#d9a441" stroke-width="1.2" fill="none"><path d="M16.5 8.8c2.6.3 5.6-1.6 9.4-.7M10 13c3 .6 5.6-.6 8.4-1.3s5.3-.5 7.5.3"/></g>
        </svg></div>
        <h3>Patriotism</h3>
        <p>Hand on heart.</p>
      </article>

      <article class="card">
        <div class="coin"><svg viewBox="0 0 32 32" aria-hidden="true" fill="#14254a">
          <path d="M16 2.5c3.6 3.3 4.2 6.4 1.8 10.3h-3.6C11.8 8.9 12.4 5.8 16 2.5z"/>
          <path d="M16 7c1.2 1.3 1.4 2.6.6 4.4h-1.2c-.8-1.8-.6-3.1.6-4.4z" fill="#f4cf72"/>
          <path d="M10 13.6h12l-2.4 4.6h-7.2z"/><path d="M13.3 18.2h5.4l-1 10.3h-3.4z"/><rect x="11.5" y="27.5" width="9" height="2.4" rx="1.2"/>
        </svg></div>
        <h3>Freedom</h3>
        <p>Why our families came.</p>
      </article>

      <article class="card">
        <div class="coin"><svg viewBox="0 0 32 32" aria-hidden="true" fill="#14254a">
          <path d="M3 29v-6h6.5v-6.5H16V10h6.5v19z"/>
          <path d="M17.5 3.5H28.5v11l-3.6-3.6-6.2 6.2-3.3-3.3 6.2-6.2z"/>
        </svg></div>
        <h3>Opportunity</h3>
        <p>Room to rise.</p>
      </article>

    </div>
  </div>
</section>
<script>
/* site helper: links to other parts of the site open in the main window; pop-ups open where the visitor is looking */
(function(){
  if(window.parent===window) return;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a||e.defaultPrevented) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;
    var u; try{u=new URL(a.getAttribute('href'),location.href);}catch(err){return;}
    if(u.origin!==location.origin) return;            /* Stripe, socials, email: leave alone */
    e.preventDefault(); e.stopPropagation(); parent.postMessage({lrc:'go',href:u.href},'*');
  },true);
  addEventListener('message',function(e){var d=e.data;if(!d||d.lrc!=='view')return;window.__LRCV=d;
    var p=document.getElementById('panel');if(p&&p.getAttribute('aria-hidden')==='false'&&window.placePanel)placePanel();});
