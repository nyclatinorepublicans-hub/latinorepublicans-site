<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&display=swap">
<style>
/* Bold header. Everything scales with the height of the Wix box (vh = box height here),
   so it fills the box edge to edge whatever height you drag it to. */
:root{--navy:#052a4b;--navy2:#0b3d6b;--deep:#021a30;--gold:#d6a844;--gold-hi:#f5d066;--gold-lo:#b68323;--red:#d51b2f}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--deep);color:#fff;font-family:"Archivo","Arial Narrow",system-ui,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px;border-radius:10px}

.hd{position:relative;height:100%;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 140% at 12% -20%,rgba(245,208,102,.16),transparent 55%),
    linear-gradient(180deg,var(--navy2) 0%,var(--navy) 55%,var(--deep) 100%)}
.hd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:14px 14px}
.bar{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;
  gap:clamp(14px,2.4vw,40px);max-width:1360px;width:100%;margin:0 auto;padding:0 clamp(16px,3.4vw,56px)}

/* brand */
.brand{display:flex;align-items:center;gap:clamp(10px,1.4vw,18px);min-width:0;height:100%}
.seal{flex:none;height:min(74vh,96px);width:auto;aspect-ratio:1;object-fit:contain;border-radius:50%;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(245,208,102,.28));
  transition:transform .35s}
.brand:hover .seal{transform:rotate(-8deg) scale(1.04)}
.name{min-width:0;overflow:hidden}
.name b{display:block;width:max-content;max-width:none;font-stretch:74%;font-weight:900;line-height:.95;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
  font-size:clamp(18px,min(25vh,2.55vw),38px);color:#fff;
  text-shadow:0 1px 0 #e3b552,0 2px 0 #c99a3a,0 3px 0 #a87a22,0 4px 0 #7a5310,0 8px 12px rgba(0,0,0,.5)}
.name small{display:flex;width:max-content;align-items:center;gap:.6em;margin-top:clamp(4px,1.6vh,8px);font-weight:800;text-transform:uppercase;white-space:nowrap;
  font-size:clamp(10px,min(9.5vh,1vw),14px);letter-spacing:.3em;color:var(--gold-hi)}
.name small::after{content:"";height:2px;width:3.2em;background:linear-gradient(90deg,var(--gold),transparent)}

/* tabs */
nav ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:clamp(2px,.5vw,8px)}
.tab{display:block;position:relative;padding:.7em .95em;font-weight:800;font-stretch:88%;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  font-size:clamp(12px,min(13.5vh,1.28vw),18px);color:#eef3fa;border-radius:12px;transition:color .2s,background .2s}
.tab::after{content:"";position:absolute;left:.95em;right:.95em;bottom:.32em;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo));transform:scaleX(0);transform-origin:left;transition:transform .25s}
.tab:hover,.tab:focus-visible{color:var(--gold-hi);background:rgba(255,255,255,.05)}
.tab:hover::after,.tab:focus-visible::after{transform:scaleX(1)}
.donate{display:inline-flex;align-items:center;gap:.5em;margin-left:clamp(6px,.8vw,14px);padding:.8em 1.45em;border-radius:999px;
  font-weight:900;font-stretch:88%;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;font-size:clamp(12px,min(13vh,1.22vw),17px);
  background:linear-gradient(180deg,#ec3346,var(--red) 55%,#b3121f);color:#fff;
  box-shadow:0 0 0 2px var(--gold),0 4px 0 2px #7a0d17,0 10px 18px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s}
.donate svg{width:1.05em;height:1.05em;fill:currentColor}
.donate:hover,.donate:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 2px var(--gold-hi),0 6px 0 2px #7a0d17,0 14px 22px rgba(0,0,0,.5)}
.donate:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--gold),0 1px 0 2px #7a0d17,0 4px 8px rgba(0,0,0,.4)}

.stripe{position:relative;display:flex;height:clamp(4px,5vh,7px);flex:none}
.stripe i{flex:1}

/* laptops: tighten tabs before anything collides */
@media (min-width:1001px) and (max-width:1180px){
  .tab{padding:.7em .6em;letter-spacing:.06em}
  .tab::after{left:.6em;right:.6em}
  .name small{letter-spacing:.22em}
}

/* phones and tablets: brand row on top, full-width tab bar below */
@media (max-width:1000px){
  .bar{flex-direction:column;justify-content:center;align-items:stretch;gap:min(5vh,10px);padding:min(6vh,12px) clamp(10px,3vw,24px)}
  .brand{justify-content:center;height:auto;flex:1;min-height:0}
  .seal{height:min(42vh,64px)}
  .name b{font-size:clamp(18px,min(15vh,6.4vw),34px)}
  .name small{font-size:clamp(9px,min(6.5vh,2.6vw),13px);letter-spacing:.26em;margin-top:min(2vh,5px)}
  nav{flex:none;width:100%;max-width:760px;margin:0 auto}
  nav ul{display:grid;grid-template-columns:1fr 1.15fr 1fr 1.3fr 1.15fr;gap:clamp(3px,1vw,8px)}
  .tab,.donate{display:flex;align-items:center;justify-content:center;text-align:center;min-height:min(28vh,46px);height:100%;
    padding:.45em .2em;font-size:clamp(10.5px,min(9vh,3.15vw),15px);letter-spacing:.04em;font-stretch:80%;white-space:normal;line-height:1.05}
  .tab{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(214,168,68,.35)}
  .tab::after{left:22%;right:22%;bottom:.28em;height:2px}
  .donate{margin:0;border-radius:12px;gap:.3em}
  .donate svg{display:none}
}
@media (max-width:359px){.name small::after{display:none}}
@media (prefers-reduced-motion:reduce){.tab,.tab::after,.donate,.seal{transition:none}.brand:hover .seal{transform:none}}

.langli{display:flex}
.lang{display:inline-flex;align-items:center;gap:6px;margin-left:clamp(6px,.8vw,12px);padding:.55em .8em;border:0;border-radius:999px;cursor:pointer;
  font:800 clamp(11px,min(11vh,1.05vw),14px) "Archivo",sans-serif;font-stretch:88%;letter-spacing:.1em;color:#fff;background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1.5px rgba(245,208,102,.7);transition:background .2s}
.lang:hover,.lang:focus-visible{background:rgba(245,208,102,.22)}
.lang svg{width:1.2em;height:1.2em;fill:none;stroke:#f5d066;stroke-width:1.8}
a.lang{text-decoration:none}
@media (max-width:1300px) and (min-width:1001px){.proflbl{display:none}}
@media (max-width:1000px){.langli{position:absolute;top:min(5vh,10px);right:clamp(8px,2.5vw,18px);z-index:2}.langli{flex-direction:column;align-items:stretch;gap:5px}.lang{margin:0;font-size:11px;padding:6px 9px;justify-content:center}.proflbl{display:none}}
</style>
</head>

   home, about, events, get-involved, donate
   ===================================================================== */
const SITE = new URL("../", location.href).href;
/* Donate button goes straight to the Stripe donation page (donor picks amount + where it goes).
   TEST MODE link: swap for the live donate.stripe.com link when you go live. */
const DONATE_LINK = "https://donate.stripe.com/test_9B65kD4W19GbdMo83x7N605";
const LINKS = {
  home:     SITE + "#home",
  about:    SITE + "#about",
  events:   SITE + "#events",
  involved: SITE + "#get-involved",
  donate:   DONATE_LINK,
  join:     SITE + "join/"
};
/* If a tab changes the address bar but the page does NOT scroll to the
   section, change false to true. The page then reloads straight onto
   that section (about a second slower, but always lands). */
const RELOAD_TO_SECTION = false;
/* ===================================================================== */
function target(key){
  let u=LINKS[key]; if(!u) return null;
  if(RELOAD_TO_SECTION){const i=u.indexOf('#');const base=i<0?u:u.slice(0,i),hash=i<0?'':u.slice(i);
    u=base+(base.includes('?')?'&':'?')+'go='+encodeURIComponent(key)+hash;}
  return u;
}
document.querySelectorAll('[data-link]').forEach(a=>{
  const u=target(a.dataset.link); if(!u) return;
  a.href=u; a.target='_top';
  a.addEventListener('click',e=>{
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;   /* let new-tab clicks behave normally */
    e.preventDefault();
    try{ window.top.location.href=u; }catch(err){ window.open(u,'_top'); }
  });
});
</script>
<script>
/* keep the club name on one line and never wider than the space it has */
(function(){
  const bar=document.querySelector('.bar'),brand=document.querySelector('.brand'),nav=document.querySelector('nav'),b=document.querySelector('.name b'),sm=document.querySelector('.name small');
  function fit(){
    b.style.fontSize='';sm.style.fontSize='';
    const cs=getComputedStyle(bar),avail=bar.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const phone=matchMedia('(max-width:1000px)').matches;
    const lb=document.querySelector('.langli'),lw=phone&&lb?lb.offsetWidth+8:0;
    const room=phone?avail-2*lw:avail-nav.scrollWidth-parseFloat(cs.columnGap||cs.gap||0);
    const sealW=document.querySelector('.seal').getBoundingClientRect().width+parseFloat(getComputedStyle(brand).columnGap||0);
    const nameRoom=room-sealW-4, need=Math.max(b.offsetWidth,sm.scrollWidth);
    if(need>nameRoom&&nameRoom>0){
      const k=Math.max(.45,nameRoom/need);
      b.style.fontSize=(parseFloat(getComputedStyle(b).fontSize)*k)+'px';
      sm.style.fontSize=(parseFloat(getComputedStyle(sm).fontSize)*Math.max(k,.75))+'px';
    }
  }
  fit();addEventListener('resize',fit);addEventListener('load',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
